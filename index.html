<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Descubra o melhor jeito de aprender violão</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PIXEL META -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '770436035819931');
    fbq('track', 'PageView');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .box {
      max-width: 500px;
      background: #fff;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
    }
    h1, h2 {
      text-align: center;
    }
    .question {
      display: none;
    }
    .question.active {
      display: block;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
    }
    .cta {
      background: #28a745;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Responda rápido 👇</h1>

  <!-- PERGUNTA 1 -->
  <div class="question active">
    <p><strong>Você já tentou aprender violão?</strong></p>
    <button onclick="next()">Sim, mas desisti</button>
    <button onclick="next()">Estou começando agora</button>
    <button onclick="next()">Nunca tentei</button>
  </div>

  <!-- PERGUNTA 2 -->
  <div class="question">
    <p><strong>Qual sua maior dificuldade?</strong></p>
    <button onclick="next()">Trocar acordes</button>
    <button onclick="next()">Ritmo</button>
    <button onclick="next()">Falta de tempo</button>
    <button onclick="next()">Outros</button>
  </div>

  <!-- PERGUNTA 3 -->
  <div class="question">
    <p><strong>Quanto tempo por dia você consegue treinar?</strong></p>
    <button onclick="finish()">10 minutos</button>
    <button onclick="finish()">20 minutos</button>
    <button onclick="finish()">30+ minutos</button>
  </div>

  <!-- RESULTADO ÚNICO -->
  <div class="question">
    <h2>🎸 Resultado</h2>

    <p>
      Com base nas suas respostas, o <strong>Método Violão em 8 Semanas</strong>
      é perfeito para você!
    </p>

    <p>
      Quer conhecer ou saber mais sobre ele?
      Clique no botão abaixo 👇
    </p>

    <button class="cta" onclick="goToSalesPage()">
      Método Violão em 8 Semanas
    </button>
  </div>

</div>

<script>
  let current = 0;
  const questions = document.querySelectorAll('.question');

  function next() {
    questions[current].classList.remove('active');
    current++;
    questions[current].classList.add('active');
  }

  function finish() {
    fbq('track', 'Lead');
    next();
  }

  function goToSalesPage() {
    // Evento quando a pessoa clica e vai para a página de vendas
    fbq('track', 'ViewContent');

    // Pequeno atraso para garantir o disparo do evento
    setTimeout(function () {
      window.location.href = "https://go.hotmart.com/H26135771I?ap=e723";
    }, 300);
  }
</script>

</body>
</html>
