<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Quiz – Violão Básico Simples</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PIXEL META -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '770436035819931');
fbq('track', 'PageView');
</script>

<style>
body {font-family: Arial;background:#f5f5f5;padding:20px;}
.box {max-width:500px;background:#fff;margin:auto;padding:20px;border-radius:8px;text-align:center;}
.question {display:none;}
.question.active {display:block;}
button {width:100%;padding:12px;margin-top:10px;font-size:16px;border-radius:6px;border:1px solid #ccc;cursor:pointer;background:#fff;}
.cta {background:#28a745;color:#fff;border:none;}
input {width:100%;padding:12px;margin-top:10px;font-size:16px;border-radius:6px;border:1px solid #ccc;}
.footer {margin-top:20px;}
.footer img {max-width:120px;opacity:0.7;}
</style>
</head>

<body>
<div class="box">
<h2>Responda rápido 👇</h2>

<!-- PERGUNTA 1 -->
<div class="question active">
<p><strong>Você já tentou aprender violão?</strong></p>
<button onclick="responderNivel('nunca')">Nunca tentei</button>
<button onclick="responderNivel('iniciante')">Estou começando</button>
<button onclick="responderNivel('travado')">Já tentei mas travo</button>
</div>

<!-- PERGUNTA 2 -->
<div class="question">
<p><strong>Qual sua maior dificuldade?</strong></p>
<button onclick="responderDificuldade('acordes')">Troca de acordes</button>
<button onclick="responderDificuldade('ritmo')">Ritmo</button>
<button onclick="responderDificuldade('tempo')">Falta de tempo</button>
<button onclick="responderDificuldade('dor_dedo')">Dor nos dedos</button>
</div>

<!-- CAPTURA -->
<div class="question">
<p><strong>Antes do resultado 👇</strong></p>
<input id="email" type="email" placeholder="Seu e-mail (obrigatório)">
<input id="whatsapp" type="text" placeholder="WhatsApp (opcional)">
<input id="palavra" type="text" placeholder="Palavra do vídeo (opcional)">
<button class="cta" onclick="enviarLead()">Ver resultado</button>
</div>

<!-- RESULTADO -->
<div class="question">
<h3>Resultado</h3>
<p>Esse método foi feito exatamente para o seu perfil 👇</p>
<button class="cta" onclick="irParaOferta()">Acessar o Método</button>
</div>

<!-- LOGO -->
<div class="footer">
<img src="1700453890630.png">
</div>
</div>

<script>
let current=0;
const q=document.querySelectorAll(".question");

let nivel="";
let dificuldade="";

const params=new URLSearchParams(window.location.search);
const origem=params.get("src")||"direto";

function next(){
q[current].classList.remove("active");
current++;
q[current].classList.add("active");
}

function responderNivel(n){nivel=n;next();}
function responderDificuldade(d){dificuldade=d;next();}

async function enviarLead(){

const email=document.getElementById("email").value.trim();
const whatsapp=document.getElementById("whatsapp").value.trim();
const palavraInput=document.getElementById("palavra").value.trim();
const palavra=palavraInput?palavraInput.toUpperCase():"nao_informado";

if(!email){
alert("Digite seu e-mail");
return;
}

try{

const response = await fetch("https://formspree.io/f/mgozgpyq",{
method:"POST",
headers:{
"Accept":"application/json",
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
whatsapp:whatsapp,
origem:origem,
nivel:nivel,
dificuldade:dificuldade,
palavra:palavra
})
});

if(response.ok){

fbq("track","LeadQualificado",{
origem:origem,
nivel:nivel,
dificuldade:dificuldade,
palavra:palavra
});

next();

}else{
alert("Falha ao enviar, tente novamente");
}

}catch(e){
alert("Conexão instável, tente novamente");
}

}

function irParaOferta(){
fbq("track","ViewContent",{origem:origem});
window.location.href="https://go.hotmart.com/H26135771I?ap=4c69&src="+origem+"_"+nivel+"_"+dificuldade;
}
</script>

</body>
</html>
