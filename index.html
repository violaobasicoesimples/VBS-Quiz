<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz – Violão Básico Simples</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PIXEL META -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '770436035819931');
    fbq('track', 'PageView');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      background: #fff;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .question {
      display: none;
    }

    .question.active {
      display: block;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
    }

    button:hover {
      background: #f0f0f0;
    }

    .cta {
      background: #28a745;
      color: #fff;
      border: none;
    }

    .cta:hover {
      background: #218838;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
    }

    .footer img {
      max-width: 120px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Responda rápido 👇</h1>

  <!-- PERGUNTA 1 -->
  <div class="question active">
    <p><strong>Você já tentou aprender violão?</strong></p>
    <button onclick="next()">Sim, mas desisti</button>
    <button onclick="next()">Estou começando agora</button>
    <button onclick="next()">Nunca tentei</button>
  </div>

  <!-- PERGUNTA 2 -->
  <div class="question">
    <p><strong>Qual sua maior dificuldade?</strong></p>
    <button onclick="next()">Trocar acordes</button>
    <button onclick="next()">Ritmo</button>
    <button onclick="next()">Falta de tempo</button>
  </div>

  <!-- CAPTURA DE LEAD -->
  <div class="question">
    <p><strong>Antes de ver o resultado, deixe seu contato 👇</strong></p>

    <form id="leadForm">
      <input type="email" name="email" placeholder="Seu e-mail (obrigatório)" required>
      <input type="text" name="whatsapp" placeholder="WhatsApp (opcional)">
      <button type="submit" class="cta">Ver resultado</button>
    </form>
  </div>

  <!-- RESULTADO -->
  <div class="question">
    <h2>Resultado</h2>
    <p>
      Com base nas suas respostas, o <strong>Método Violão em 8 Semanas</strong>
      é perfeito para você.
    </p>

    <button class="cta" onclick="irParaOferta()">
      Acessar o Método Violão em 8 Semanas
    </button>
  </div>

  <!-- LOGO RODAPÉ -->
  <div class="footer">
    <img src="1700453890630.png" alt="Violão Básico Simples">
  </div>

</div>

<script>
  let current = 0;
  const questions = document.querySelectorAll('.question');

  function next() {
    questions[current].classList.remove('active');
    current++;
    questions[current].classList.add('active');
  }

  document.getElementById("leadForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("https://formspree.io/f/mgozgpyq", {
      method: "POST",
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    }).then(() => {
      fbq('track', 'Lead');
      next();
    }).catch(() => {
      alert("Erro ao enviar. Tente novamente.");
    });
  });

  function irParaOferta() {
    fbq('track', 'ViewContent');
    window.location.href = "https://go.hotmart.com/H26135771I?ap=e723";
  }
</script>

</body>
</html>
