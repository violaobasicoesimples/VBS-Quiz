<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quiz – Violão Básico Simples</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PIXEL META -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '770436035819931');
    fbq('track', 'PageView');
  </script>

  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .box { max-width: 500px; background: #fff; margin: auto; padding: 20px; border-radius: 8px; text-align: center; }
    .question { display: none; }
    .question.active { display: block; }
    button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; background: #fff; }
    .cta { background: #28a745; color: #fff; border: none; }
    input { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    .footer { margin-top: 20px; }
    .footer img { max-width: 120px; opacity: 0.7; }
  </style>
</head>

<body>
<div class="box">
  <h2>Responda rápido 👇</h2>

  <!-- PERGUNTA 1 -->
  <div class="question active">
    <p><strong>Você já tentou aprender violão?</strong></p>
    <button onclick="next()">Sim, mas desisti</button>
    <button onclick="next()">Estou começando agora</button>
    <button onclick="next()">Nunca tentei</button>
  </div>

  <!-- PERGUNTA 2 -->
  <div class="question">
    <p><strong>Qual sua maior dificuldade?</strong></p>
    <button onclick="next()">Troca de acordes</button>
    <button onclick="next()">Ritmo</button>
    <button onclick="next()">Falta de tempo</button>
    <button onclick="next()">Outros motivos</button>
  </div>

  <!-- CAPTURA DE LEAD -->
  <div class="question">
    <p><strong>Antes do resultado, deixe seu contato 👇</strong></p>

    <input id="email" type="email" placeholder="Seu e-mail (obrigatório)">
    <input id="whatsapp" type="text" placeholder="WhatsApp com DDD (opcional)">
    <button class="cta" onclick="enviarLead()">Ver resultado</button>
  </div>

  <!-- RESULTADO -->
  <div class="question">
    <h3>Resultado</h3>
    <p>
      Com base nas suas respostas, o <strong>Método Violão em 8 Semanas</strong>
      é ideal para você. Clique no botão abaixo e saiba mais!
    </p>
    <button class="cta" onclick="irParaOferta()">Acessar o Método Violão em 8 Semanas</button>
  </div>

  <!-- LOGO -->
  <div class="footer">
    <img src="1700453890630.png" alt="Violão Básico e Simples">
  </div>
</div>

<script>
  let current = 0;
  const questions = document.querySelectorAll(".question");

  function next() {
    questions[current].classList.remove("active");
    current++;
    questions[current].classList.add("active");
  }

  function enviarLead() {
    const email = document.getElementById("email").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();

    // Regex básico de email válido
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Lista de emails claramente falsos
    const invalidos = ["teste@teste.com", "email@email.com", "a@a.com", "aa@aa.com"];

    if (!email) {
      alert("Digite seu e-mail para continuar");
      return;
    }

    if (!emailRegex.test(email)) {
      alert("Digite um e-mail válido");
      return;
    }

    if (invalidos.includes(email.toLowerCase())) {
      alert("Digite um e-mail real para continuar");
      return;
    }

    // Se passou na validação, considera lead qualificado
    fbq("track", "LeadQualificado");

    // Envia para Formspree
    fetch("https://formspree.io/f/mgozgpyq", {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, whatsapp: whatsapp })
    }).then(() => {
      next(); // Mostra resultado
    }).catch(() => {
      alert("Erro ao enviar. Tente novamente.");
    });
  }

  function irParaOferta() {
    fbq("track", "ViewContent");
    window.location.href = "https://go.hotmart.com/H26135771I?ap=4c69";
  }
</script>
</body>
</html>
